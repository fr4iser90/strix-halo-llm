# Dedicated bench routers — Stickys stay untouched.
#
#   docker compose -f compose.yaml -f compose.bench.yaml --profile bench up -d llama-bench-a
#
# Web UI follows LLAMA_WEBUI from .env (same as compose.yaml).
#
# Ports: :11601 (A) · :11602 (B)

services:
  llama-bench-a:
    image: llama-cpp-vulkan-nix
    profiles: ["bench"]
    container_name: llama-bench-a
    devices:
      - /dev/dri
    device_cgroup_rules:
      - "c 226:* rmw"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: "16gb"
    restart: "no"
    environment:
      LLAMA_WEBUI: ${LLAMA_WEBUI:-true}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./models:/models
      - ./models-bench.ini:/etc/llama-cpp/models.ini:ro
      - /dev/dri:/dev/dri
      - ./scripts/docker-entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "11601:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models.ini",
        "--models-max", "1",
        "--sleep-idle-seconds", "900",
      ]

  llama-bench-b:
    image: llama-cpp-vulkan-nix
    profiles: ["bench"]
    container_name: llama-bench-b
    devices:
      - /dev/dri
    device_cgroup_rules:
      - "c 226:* rmw"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: "16gb"
    restart: "no"
    environment:
      LLAMA_WEBUI: ${LLAMA_WEBUI:-true}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./models:/models
      - ./models-bench-b.ini:/etc/llama-cpp/models.ini:ro
      - /dev/dri:/dev/dri
      - ./scripts/docker-entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "11602:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models.ini",
        "--models-max", "1",
        "--sleep-idle-seconds", "900",
      ]
