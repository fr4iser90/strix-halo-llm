# CUDA bench routers — stickys untouched (same ports as compose.bench.yaml).
#
#   docker compose -f compose.cuda.yaml -f compose.cuda.bench.yaml --profile bench up -d llama-bench-a
#
# Image: llama-cpp-cuda (see Dockerfile.cuda). Env LLAMA_CUDA_IMAGE overrides.

x-bench-gpu: &bench-gpu
  image: ${LLAMA_CUDA_IMAGE:-llama-cpp-cuda:latest}
  profiles: ["bench"]
  runtime: nvidia
  ipc: host
  shm_size: "16gb"
  restart: "no"
  environment:
    LLAMA_WEBUI: ${LLAMA_WEBUI:-true}
    NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: ${NVIDIA_DEVICE_COUNT:-1}
            capabilities: [gpu]
  entrypoint: ["/bin/sh", "/entrypoint.sh"]

services:
  llama-bench-a:
    <<: *bench-gpu
    container_name: llama-bench-a
    volumes:
      - ./models:/models
      - ./models-bench.ini:/etc/llama-cpp/models.ini:ro
      - ./scripts/docker-entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "11601:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models.ini",
        "--models-max", "1",
        "--sleep-idle-seconds", "900",
      ]

  llama-bench-b:
    <<: *bench-gpu
    container_name: llama-bench-b
    volumes:
      - ./models:/models
      - ./models-bench-b.ini:/etc/llama-cpp/models.ini:ro
      - ./scripts/docker-entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "11602:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models.ini",
        "--models-max", "1",
        "--sleep-idle-seconds", "900",
      ]
