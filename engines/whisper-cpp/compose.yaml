# whisper.cpp STT server on :9000
#
#   cd engines/whisper-cpp
#   docker compose --env-file ../../.env up -d --build
#
# Models: STT_MODELS host dir → /models (must contain WHISPER_MODEL).
# Default relative path is only a fallback; ./stack always passes absolute STT_MODELS.
services:
  whisper:
    build: .
    container_name: whisper-cpp
    restart: unless-stopped
    ports:
      - "${WHISPER_PUBLISH_PORT:-9000}:8080"
    volumes:
      - ${STT_MODELS:?set STT_MODELS to host stt dir}:/models:ro
    command: >
      ./build/bin/whisper-server
      --host 0.0.0.0
      --port 8080
      --model /models/${WHISPER_MODEL:-ggml-large-v3.bin}
