# Sticky chat (:11535) + sticky coder (:11538) always.
# Optional profiles:
#   --profile rag    → embeddings (:11536) + extractor (:11539)
#   --profile lab    → lab swap pool (:11537)
#   --profile bench  → capacity routers :11601 / :11602 (stickys untouched)
#
# From engines/llama-cpp/:
#   docker compose --env-file ../../.env up -d
#   docker compose --env-file ../../.env --profile rag --profile lab up -d
#   docker compose --env-file ../../.env --profile bench up -d llama-bench-a
#
# Weights: MODELS_DIR (GGUF tree). Default ../../models/gguf
#   Jarvis: MODELS_DIR=$HOME/data/models/gguf
# Web UI: LLAMA_WEBUI=false in .env → API-only. Default: true.
#
# Image: llama-cpp-vulkan-nix — build: ./build-nix-image.sh
# Other AMD: compose.rocm.yaml (see HARDWARE.md). No NVIDIA/CUDA in this repo.
name: llama-cpp-vulkan

x-llama-gpu: &llama-gpu
  image: llama-cpp-vulkan-nix
  devices:
    - /dev/dri
  device_cgroup_rules:
    - "c 226:* rmw"
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp=unconfined
  ipc: host
  shm_size: "16gb"
  restart: unless-stopped
  environment:
    LLAMA_WEBUI: ${LLAMA_WEBUI:-true}
  entrypoint: ["/bin/sh", "/entrypoint.sh"]

x-entrypoint-mount: &entrypoint-mount
  ./scripts/docker-entrypoint.sh:/entrypoint.sh:ro

services:
  llama:
    <<: *llama-gpu
    container_name: llama-router
    volumes:
      - ${MODELS_DIR:-../../models/gguf}:/models
      - ./models.ini:/etc/llama-cpp/models.ini:ro
      - /dev/dri:/dev/dri
      - *entrypoint-mount
    ports:
      - "11535:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models.ini",
        "--models-max", "1",
      ]

  llama-coder:
    <<: *llama-gpu
    container_name: llama-router-coder
    volumes:
      - ${MODELS_DIR:-../../models/gguf}:/models
      - ./models-coder.ini:/etc/llama-cpp/models.ini:ro
      - /dev/dri:/dev/dri
      - *entrypoint-mount
    ports:
      - "11538:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models.ini",
        "--models-max", "1",
      ]

  llama-lab:
    <<: *llama-gpu
    profiles: ["lab"]
    container_name: llama-router-lab
    volumes:
      - ${MODELS_DIR:-../../models/gguf}:/models
      - ./models-lab.ini:/etc/llama-cpp/models.ini:ro
      - /dev/dri:/dev/dri
      - *entrypoint-mount
    ports:
      - "11537:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models.ini",
        "--models-max", "1",
        "--sleep-idle-seconds", "900",
      ]

  llama-embeddings:
    <<: *llama-gpu
    profiles: ["rag"]
    container_name: llama-embeddings
    volumes:
      - ${MODELS_DIR:-../../models/gguf}:/models
      - ./models-embeddings.ini:/etc/llama-cpp/models-embeddings.ini:ro
      - /dev/dri:/dev/dri
      - *entrypoint-mount
    ports:
      - "11536:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models-embeddings.ini",
        "--models-max", "1",
      ]

  llama-extractor:
    <<: *llama-gpu
    profiles: ["rag"]
    container_name: llama-extractor
    volumes:
      - ${MODELS_DIR:-../../models/gguf}:/models
      - ./models-extractor.ini:/etc/llama-cpp/models-extractor.ini:ro
      - /dev/dri:/dev/dri
      - *entrypoint-mount
    ports:
      - "11539:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models-extractor.ini",
        "--models-max", "1",
      ]

  # Capacity / quality / sched isolation (not started with plain `up -d`)
  llama-bench-a:
    <<: *llama-gpu
    profiles: ["bench"]
    container_name: llama-bench-a
    restart: "no"
    volumes:
      - ${MODELS_DIR:-../../models/gguf}:/models
      - ./models-bench.ini:/etc/llama-cpp/models.ini:ro
      - /dev/dri:/dev/dri
      - *entrypoint-mount
    ports:
      - "11601:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models.ini",
        "--models-max", "1",
        "--sleep-idle-seconds", "900",
      ]

  llama-bench-b:
    <<: *llama-gpu
    profiles: ["bench"]
    container_name: llama-bench-b
    restart: "no"
    volumes:
      - ${MODELS_DIR:-../../models/gguf}:/models
      - ./models-bench-b.ini:/etc/llama-cpp/models.ini:ro
      - /dev/dri:/dev/dri
      - *entrypoint-mount
    ports:
      - "11602:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models.ini",
        "--models-max", "1",
        "--sleep-idle-seconds", "900",
      ]
